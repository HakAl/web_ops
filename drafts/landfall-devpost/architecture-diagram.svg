<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Landfall governed defect-triage fleet architecture</title>
  <desc id="desc">A support lead authorizes one FleetRun. A highlighted real-cloud probe uses Cloud Run, ADK, Gemini, Firestore, an outbox relay, and Pub/Sub. An outlined local governance demonstration shows supervision, worker succession, stale closeout refusal, deterministic verification, another item continuing, and a read-only console.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#152536"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B42318"/>
    </marker>
    <style>
      .bg{fill:#FCFBF7}.ink{fill:#152536}.muted{fill:#526476}.title{font:700 38px Inter,Arial,sans-serif}.subtitle{font:500 19px Inter,Arial,sans-serif}.lane-title{font:700 17px Inter,Arial,sans-serif;letter-spacing:1.5px}.node-title{font:700 18px Inter,Arial,sans-serif}.body{font:500 15px Inter,Arial,sans-serif}.small{font:500 13px Inter,Arial,sans-serif}.mono{font:600 13px "IBM Plex Mono",Consolas,monospace}.human{fill:#FFF4DB;stroke:#152536;stroke-width:2}.cloud{fill:#D9F1F2;stroke:#087E8B;stroke-width:3}.local{fill:#FCFBF7;stroke:#B56A00;stroke-width:3;stroke-dasharray:9 7}.authority{fill:#fff;stroke:#152536;stroke-width:5}.refusal{fill:#FFF4F2;stroke:#B42318;stroke-width:3}.cloud-lane{fill:#F1FAFA;stroke:#087E8B;stroke-width:2}.local-lane{fill:#FFF9EC;stroke:#B56A00;stroke-width:2;stroke-dasharray:11 8}.edge{fill:none;stroke:#152536;stroke-width:2.4;marker-end:url(#arrow)}.edge-red{fill:none;stroke:#B42318;stroke-width:2.8;stroke-dasharray:8 6;marker-end:url(#arrow-red)}.edge-dash{fill:none;stroke:#152536;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow)}.legend-line{stroke-width:3}.chip-cloud{fill:#087E8B}.chip-local{fill:#B56A00}.chip-green{fill:#18794E}.white{fill:#fff}.rule{fill:#FCFBF7;stroke:#526476;stroke-width:1.2}.grid{stroke:#E5E1D8;stroke-width:1;opacity:.5}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <path class="grid" d="M40 120H1560M40 470H1560M40 870H1560"/>

  <text x="48" y="58" class="title ink">LANDFALL</text>
  <text x="48" y="88" class="subtitle muted">One bounded run envelope. Fenced attempts. Deterministic completion authority.</text>

  <g aria-label="Legend">
    <rect x="1040" y="38" width="18" height="18" rx="4" class="cloud"/>
    <text x="1068" y="53" class="small ink">Demonstrated in the real-cloud vertical slice</text>
    <rect x="1040" y="72" width="18" height="18" rx="4" class="local"/>
    <text x="1068" y="87" class="small ink">Implemented and demonstrated locally</text>
  </g>

  <g aria-label="Human authorization">
    <rect x="48" y="154" width="202" height="94" rx="16" class="human"/>
    <text x="149" y="185" text-anchor="middle" class="node-title ink">Support lead</text>
    <text x="149" y="211" text-anchor="middle" class="body ink">non-code-reviewing</text>
    <text x="149" y="233" text-anchor="middle" class="body ink">operator</text>

    <rect x="300" y="144" width="250" height="114" rx="16" class="human"/>
    <rect x="322" y="158" width="206" height="24" rx="12" fill="#152536"/>
    <text x="425" y="175" text-anchor="middle" class="small white">ONE HUMAN APPROVAL</text>
    <text x="425" y="207" text-anchor="middle" class="node-title ink">FleetRun initiation</text>
    <text x="425" y="232" text-anchor="middle" class="small ink">paths · budgets · attempts · predicates</text>
    <path class="edge" d="M250 201 H300"/>
  </g>

  <g aria-label="Real cloud vertical slice">
    <rect x="590" y="122" width="962" height="318" rx="22" class="cloud-lane"/>
    <rect x="614" y="140" width="184" height="25" rx="12" class="chip-cloud"/>
    <text x="706" y="157" text-anchor="middle" class="small white">REAL CLOUD PROBE</text>

    <rect x="620" y="190" width="176" height="92" rx="14" class="cloud"/>
    <text x="708" y="220" text-anchor="middle" class="node-title ink">Cloud Run</text>
    <text x="708" y="246" text-anchor="middle" class="body ink">bounded probe</text>
    <text x="708" y="268" text-anchor="middle" class="small muted">HTTP runtime</text>

    <rect x="844" y="190" width="204" height="92" rx="14" class="cloud"/>
    <text x="946" y="220" text-anchor="middle" class="node-title ink">ADK + Gemini</text>
    <text x="946" y="246" text-anchor="middle" class="body ink">3.7 Flash</text>
    <text x="946" y="268" text-anchor="middle" class="small muted">structured triage</text>

    <rect x="1096" y="174" width="214" height="124" rx="16" class="authority"/>
    <text x="1203" y="205" text-anchor="middle" class="node-title ink">Firestore</text>
    <text x="1203" y="230" text-anchor="middle" class="small ink">AUTHORITATIVE STATE</text>
    <text x="1203" y="254" text-anchor="middle" class="small muted">FleetRun · work · attempt</text>
    <text x="1203" y="275" text-anchor="middle" class="small muted">receipt · decision · outbox</text>

    <rect x="1358" y="184" width="162" height="94" rx="14" class="cloud"/>
    <text x="1439" y="214" text-anchor="middle" class="node-title ink">Outbox relay</text>
    <text x="1439" y="239" text-anchor="middle" class="small ink">publishes outside</text>
    <text x="1439" y="259" text-anchor="middle" class="small ink">transactions</text>

    <rect x="1358" y="326" width="162" height="86" rx="14" class="cloud"/>
    <text x="1439" y="356" text-anchor="middle" class="node-title ink">Pub/Sub</text>
    <text x="1439" y="381" text-anchor="middle" class="small ink">at-least-once</text>
    <text x="1439" y="401" text-anchor="middle" class="small ink">transport</text>

    <rect x="1096" y="330" width="214" height="82" rx="14" class="cloud"/>
    <text x="1203" y="359" text-anchor="middle" class="node-title ink">Consumer</text>
    <text x="1203" y="384" text-anchor="middle" class="small ink">deduplicates on event_id</text>
    <text x="1203" y="403" text-anchor="middle" class="small muted">one logical effect</text>

    <path class="edge" d="M796 236 H844"/>
    <path class="edge" d="M1048 236 H1096"/>
    <path class="edge" d="M1310 236 H1358"/>
    <path class="edge" d="M1439 278 V326"/>
    <path class="edge" d="M1358 369 H1310"/>
    <path class="edge" d="M1096 369 H1068 V286 H1096"/>
    <text x="1333" y="219" text-anchor="middle" class="small muted">outbox</text>
  </g>

  <path class="edge" d="M550 201 H590 V173 H1096"/>

  <g aria-label="Deterministic local governance demonstration">
    <rect x="48" y="500" width="1504" height="332" rx="22" class="local-lane"/>
    <rect x="72" y="519" width="384" height="25" rx="12" class="chip-local"/>
    <text x="264" y="536" text-anchor="middle" class="small white">DETERMINISTIC LOCAL GOVERNANCE DEMONSTRATION</text>

    <rect x="74" y="584" width="176" height="92" rx="14" class="local"/>
    <text x="162" y="614" text-anchor="middle" class="node-title ink">Kill harness</text>
    <text x="162" y="640" text-anchor="middle" class="small ink">observes local</text>
    <text x="162" y="660" text-anchor="middle" class="small ink">process exit</text>

    <rect x="300" y="574" width="190" height="112" rx="14" class="local"/>
    <text x="395" y="605" text-anchor="middle" class="node-title ink">Supervisor</text>
    <text x="395" y="631" text-anchor="middle" class="small ink">admission · routing</text>
    <text x="395" y="652" text-anchor="middle" class="small ink">succession</text>
    <text x="395" y="673" text-anchor="middle" class="small muted">bounded by envelope</text>

    <rect x="544" y="564" width="214" height="122" rx="14" class="local"/>
    <text x="651" y="595" text-anchor="middle" class="node-title ink">Worker attempt N</text>
    <text x="651" y="621" text-anchor="middle" class="small ink">checkpoint + reference</text>
    <text x="651" y="647" text-anchor="middle" class="small ink">cannot write terminal state</text>
    <text x="651" y="671" text-anchor="middle" class="mono muted">generation N</text>

    <rect x="812" y="564" width="214" height="122" rx="14" class="local"/>
    <text x="919" y="595" text-anchor="middle" class="node-title ink">Successor N+1</text>
    <text x="919" y="621" text-anchor="middle" class="small ink">atomic generation bump</text>
    <text x="919" y="646" text-anchor="middle" class="mono ink">parent_attempt_id = N</text>
    <text x="919" y="671" text-anchor="middle" class="small muted">new active authority</text>

    <path d="M1092 564 H1286 L1322 625 L1286 686 H1092 L1056 625 Z" class="local"/>
    <text x="1189" y="596" text-anchor="middle" class="node-title ink">Verifier</text>
    <text x="1189" y="622" text-anchor="middle" class="small ink">deterministic, not a model</text>
    <text x="1189" y="647" text-anchor="middle" class="small ink">retrieves or reproduces</text>
    <text x="1189" y="671" text-anchor="middle" class="small ink">completion evidence</text>

    <rect x="544" y="728" width="214" height="72" rx="14" class="local"/>
    <text x="651" y="758" text-anchor="middle" class="node-title ink">Another work item</text>
    <text x="651" y="783" text-anchor="middle" class="small ink">continues independently</text>

    <rect x="812" y="728" width="214" height="72" rx="14" class="refusal"/>
    <text x="919" y="758" text-anchor="middle" class="node-title ink">stale_attempt</text>
    <text x="919" y="783" text-anchor="middle" class="small ink">terminal state unchanged</text>

    <rect x="1354" y="584" width="168" height="96" rx="14" class="local"/>
    <text x="1438" y="614" text-anchor="middle" class="node-title ink">Console</text>
    <text x="1438" y="640" text-anchor="middle" class="small ink">READ-ONLY</text>
    <text x="1438" y="660" text-anchor="middle" class="small ink">NON-AUTHORITATIVE</text>

    <path class="edge" d="M250 630 H300"/>
    <path class="edge" d="M490 625 H544"/>
    <path class="edge" d="M758 625 H812"/>
    <path class="edge" d="M1026 625 H1056"/>
    <path class="edge" d="M395 686 V764 H544"/>
    <path class="edge-red" d="M651 686 V706 H919 V728"/>
    <text x="785" y="611" text-anchor="middle" class="small muted">lease expiry</text>
    <text x="788" y="704" text-anchor="middle" class="small" fill="#B42318">authentic predecessor closeout refused</text>
  </g>

  <path class="edge-dash" d="M1203 298 V476 H395 V574"/>
  <text x="761" y="468" text-anchor="middle" class="small muted">authoritative cursor and state contract</text>
  <path class="edge-dash" d="M1189 564 V476 H1203 V298"/>
  <text x="1268" y="472" class="small muted">verifier-controlled terminal write</text>
  <path class="edge-dash" d="M1310 254 H1332 V632 H1354"/>

  <g aria-label="Invariant notes">
    <rect x="48" y="868" width="1504" height="92" rx="14" class="rule"/>
    <text x="72" y="895" class="node-title ink">Authority and transport notes</text>
    <text x="72" y="922" class="body ink">Lease expiry proves expiry, not death. Unknown authorizes no terminal write. Transactions write outbox records; publishing occurs outside transactions.</text>
    <text x="72" y="947" class="small muted">Firestore transaction retries: https://cloud.google.com/firestore/docs/manage-data/transactions · Pub/Sub delivery: https://cloud.google.com/pubsub/docs/subscriber</text>
  </g>
</svg>
